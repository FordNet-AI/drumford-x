<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Brand gradients for the DF letters -->
    <linearGradient id="dGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#33eeff"/>
      <stop offset="100%" stop-color="#00b8cc"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff5577"/>
      <stop offset="100%" stop-color="#cc1f3f"/>
    </linearGradient>

    <!-- Wood color for drumsticks: warm tan top, darker bottom for shading -->
    <linearGradient id="stickWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d4ad79"/>
      <stop offset="100%" stop-color="#8a6633"/>
    </linearGradient>

    <!-- Chrome rim — silver gradient suggesting metal hoop -->
    <linearGradient id="chromeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8e8f0"/>
      <stop offset="50%" stop-color="#888899"/>
      <stop offset="100%" stop-color="#444455"/>
    </linearGradient>

    <!-- Drum head surface: subtle radial so it reads as a real surface -->
    <radialGradient id="headSurface" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#1a2440"/>
      <stop offset="60%" stop-color="#0c1422"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>

    <!-- Soft glow filter for the DF letters -->
    <filter id="letterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Background ambient glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%"  stop-color="#1a2440" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background (Android maskable-safe + iOS standard) -->
  <rect width="1024" height="1024" rx="180" fill="#0d1424"/>
  <rect width="1024" height="1024" rx="180" fill="url(#bgGlow)"/>

  <!-- ─── Crossed drumsticks BEHIND the drum ──────────────────────── -->
  <!-- Sticks need to extend well past the drum's chrome rim (radius 320)
       so their ends poke out at the corners of the icon. Length 940 with
       a 35° rotation puts each end ~150px outside the rim, plenty visible. -->
  <g>
    <!-- Stick 1: top-left → bottom-right -->
    <g transform="rotate(40 512 480)">
      <rect x="42" y="462" width="940" height="36" rx="18" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
      <!-- Striking tip (small ball at the top-left end) -->
      <circle cx="42" cy="480" r="28" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
      <!-- Butt end -->
      <circle cx="982" cy="480" r="22" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
    </g>
    <!-- Stick 2: top-right → bottom-left -->
    <g transform="rotate(-40 512 480)">
      <rect x="42" y="462" width="940" height="36" rx="18" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
      <circle cx="42" cy="480" r="28" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
      <circle cx="982" cy="480" r="22" fill="url(#stickWood)" stroke="#3d2810" stroke-width="3"/>
    </g>
  </g>

  <!-- ─── The drum itself ──────────────────────────────────────────── -->
  <!-- Outer chrome rim (the visible drum hoop) -->
  <circle cx="512" cy="480" r="320" fill="url(#chromeRim)"/>

  <!-- Inner ring shadow (so the rim feels like a 3D hoop, not flat) -->
  <circle cx="512" cy="480" r="305" fill="none" stroke="#0a0a14" stroke-width="3" opacity="0.4"/>

  <!-- Drum head — the dark playing surface where DF lives -->
  <circle cx="512" cy="480" r="290" fill="url(#headSurface)"/>

  <!-- Tension lugs: 8 evenly spaced around the rim, brass-toned for contrast.
       Each one is a small "key" shape that pokes inward from the chrome rim. -->
  <g fill="#c4a05a" stroke="#5c3f1a" stroke-width="2">
    <circle cx="512" cy="170"  r="18"/>
    <circle cx="731" cy="261"  r="18"/>
    <circle cx="822" cy="480"  r="18"/>
    <circle cx="731" cy="699"  r="18"/>
    <circle cx="512" cy="790"  r="18"/>
    <circle cx="293" cy="699"  r="18"/>
    <circle cx="202" cy="480"  r="18"/>
    <circle cx="293" cy="261"  r="18"/>
  </g>

  <!-- Subtle head highlight (top-left shine — sells "this is a real surface") -->
  <ellipse cx="380" cy="370" rx="180" ry="80" fill="rgba(255, 255, 255, 0.05)"/>

  <!-- ─── DF letters CENTERED ON THE HEAD ──────────────────────────── -->
  <!-- Glow behind the letters -->
  <g filter="url(#letterGlow)" opacity="0.6">
    <text x="512" y="600"
          text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif"
          font-size="380"
          font-weight="900">
      <tspan fill="#00e5ff">D</tspan><tspan fill="#ff3a5c">F</tspan>
    </text>
  </g>
  <!-- The DF itself, full brand colors -->
  <text x="512" y="600"
        text-anchor="middle"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="380"
        font-weight="900">
    <tspan fill="url(#dGrad)">D</tspan><tspan fill="url(#fGrad)">F</tspan>
  </text>

  <!-- ─── DRUMFORD wordmark UNDER the drum ─────────────────────────── -->
  <text x="512" y="930"
        text-anchor="middle"
        font-family="'Share Tech Mono', 'Courier New', monospace"
        font-size="80"
        font-weight="700"
        letter-spacing="12"
        fill="#ddd">
    DRUMFORD
  </text>
</svg>
