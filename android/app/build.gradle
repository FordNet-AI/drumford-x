apply plugin: 'com.android.application'

android {
    namespace = "com.fordnet.drumfordx"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fordnet.drumfordx"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode / versionName are property-driven so the Play release CI
        // can pass an incrementing code (-PvCode=<run#>) without editing this
        // file each release. Defaults preserve the original sideload values
        // for any build that doesn't pass them.
        versionCode (project.findProperty('vCode') ?: 1).toString().toInteger()
        versionName project.findProperty('vName') ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Stable debug keystore so APKs signed by different CI runs (or
    // different dev machines) share a signature. Without this, every CI
    // run generates its own ephemeral debug.keystore and `adb install -r`
    // fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE, forcing a full
    // uninstall (which wipes the user's IndexedDB-backed song library +
    // kit settings on the tablet).
    //
    // The keystore lives at android/app/debug.keystore and is committed
    // to the repo. Standard Android default alias/passwords — this is a
    // DEBUG keystore, not security-sensitive.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "JKS"
        }
        // Release (Play Store) signing — the UPLOAD key for Google Play App
        // Signing. Reads everything from environment variables (set by the
        // android-release.yml CI from GitHub secrets) so no key material or
        // password is ever hardcoded or committed. The keystore file itself
        // (upload-keystore.jks) is gitignored. If the env vars are absent
        // (e.g. a plain debug build elsewhere) this block stays inert and the
        // release config simply has no store — only the Play CI ever uses it.
        release {
            def ksFile = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                storeType "JKS"
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Only attach the release signing config when the upload keystore
            // is actually present (CI sets ANDROID_KEYSTORE_PATH). This keeps
            // `gradlew assembleDebug` and unsigned local builds working even
            // without the secrets.
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
